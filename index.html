<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ════════════════════════════════════════════════════════════════════
//  SEOUL 2038 — five years after the Seoul Aurora
// ════════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",sans-serif';
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
async function step(msg) { $('loadmsg').textContent = msg; await nextFrame(); }

// ── seeded random ───────────────────────────────────────────────────
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(20380512);
const R = (a = 0, b = 1) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const chance = (p) => rand() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const d2 = (x, z, o) => (x - o.x) * (x - o.x) + (z - o.z) * (z - o.z);

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * noise2(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

// ── world layout ────────────────────────────────────────────────────
const CITY = 1350, TER = 2800, BASE = 3, GRID = 100, RIVER_HW = 165;
const NAMSAN = { x: 250, z: -150 };
const riverZ = (x) => 420 + 60 * Math.sin(x * 0.0011 + 0.4);
function heightAt(x, z) {
  let h = BASE + (fbm(x * 0.003 + 11, z * 0.003 + 5, 3) - 0.5) * 3;
  const dx = x - NAMSAN.x, dz = z - NAMSAN.z;
  h += 240 * Math.exp(-(dx * dx + dz * dz) / 57800) * (0.85 + 0.3 * fbm(x * 0.01, z * 0.01, 2));
  const rd = Math.abs(z - riverZ(x));
  const e = Math.max(Math.abs(x) - 1320, -z - 1220, z - 1480);
  if (e > -120) {
    const m = smooth(-120, 520, e) * smooth(RIVER_HW + 20, RIVER_HW + 420, rd);
    const r = fbm(x * 0.0021 + 7, z * 0.0021 + 3, 5);
    h += m * (140 + 380 * r * r + 60 * (1 - Math.abs(2 * noise2(x * 0.006, z * 0.006) - 1)));
  }
  if (rd < RIVER_HW + 40) h = lerp(-7, h, smooth(RIVER_HW - 6, RIVER_HW + 30, rd));
  return h;
}
const hillAt = (x, z) => heightAt(x, z) - BASE;
function terrainInterp(x, z) { // matches the 10 m terrain mesh
  const x0 = Math.floor(x / 10) * 10, z0 = Math.floor(z / 10) * 10, fx = (x - x0) / 10, fz = (z - z0) / 10;
  const a = heightAt(x0, z0), b = heightAt(x0 + 10, z0), c = heightAt(x0, z0 + 10), d = heightAt(x0 + 10, z0 + 10);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
}

const SITE = {
  gate: { x: -300, z: -1050 }, tower: { x: 250, z: -150 },
  hole: { x: -150, z: -650 }, slice: { x: 346, z: 941 },
  twist: { x: -900, z: 150 }, bridge: { x: 800 }, canyon: { x0: -1150, x1: -750, z: -400 },
  crater: { x: -1050, z: 1240 }, crystal: { x: -900, z: -900 }, ice: { x: 1000, z: -300, r: 240 },
  scorch: { x: -650, z: -150 },
};
const inIce = (x, z) => d2(x, z, SITE.ice) < SITE.ice.r * SITE.ice.r;
const iceAmt = (x, z) => 1 - smooth(SITE.ice.r * 0.75, SITE.ice.r, Math.sqrt(d2(x, z, SITE.ice)));
const inPalace = (x, z) => x > -560 && x < -40 && z < -1030 && z > -1320;
const CUTS = [ // terrain holes replaced by detailed patches  [x0,z0,x1,z1]
  [-1170, -440, -730, -360],
  [SITE.crater.x - 110, SITE.crater.z - 110, SITE.crater.x + 110, SITE.crater.z + 110],
];
const inCut = (x, z, pad = 0) => CUTS.some((r) => x > r[0] - pad && x < r[2] + pad && z > r[1] - pad && z < r[3] + pad);
const reserved = [];
const reserve = (x, z, r) => reserved.push({ x, z, r });
const isReserved = (x, z, r) => reserved.some((o) => d2(x, z, o) < (o.r + r) * (o.r + r));

// elevated expressway path (weaves through downtown)
const HW_PTS = [[-1800, -560], [-1350, -560], [-1000, -650], [-720, -600], [-480, -720], [-240, -790], [60, -740], [380, -820], [700, -720], [1000, -780], [1350, -680], [1800, -700]];
const HW_Y = BASE + 22;
const hwCurve = new THREE.CatmullRomCurve3(HW_PTS.map((p) => new THREE.Vector3(p[0], HW_Y, p[1])), false, 'catmullrom', 0.5);
const hwSamples = hwCurve.getSpacedPoints(700);
const hwHash = new Map();
for (const p of hwSamples) { const k = Math.floor(p.x / 50) + ',' + Math.floor(p.z / 50); if (!hwHash.has(k)) hwHash.set(k, []); hwHash.get(k).push(p); }
function nearHighway(x, z, r) {
  const cx = Math.floor(x / 50), cz = Math.floor(z / 50);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const arr = hwHash.get((cx + i) + ',' + (cz + j)); if (!arr) continue;
    for (const p of arr) if ((p.x - x) ** 2 + (p.z - z) ** 2 < r * r) return true;
  }
  return false;
}

function lineW(axis, k, along) {
  if (axis === 'x' && k === -3 && along < riverZ(-300)) return 60;
  if (axis === 'z' && k === 10) return 50;
  return (k % 4 === 0) ? 32 : 16;
}
function roadValid(x, z) {
  if (Math.abs(x) > CITY + 30 || z < -1180 || z > 1420) return false;
  if (Math.abs(z - riverZ(x)) < RIVER_HW + 22) return false;
  if (hillAt(x, z) > 9) return false;
  if (inPalace(x, z)) return false;
  if (d2(x, z, SITE.crater) < 105 * 105) return false;
  return true;
}
function district(x, z) {
  const hl = hillAt(x, z);
  const rd = Math.abs(z - riverZ(x));
  if (rd < RIVER_HW + 32) return 'none';
  if (inPalace(x, z)) return 'none';
  if (Math.abs(x) > CITY || z < -1180 || z > 1420) return (hl > 12 && hl < 70 && Math.abs(x) < 1750 && z > -1500 && z < 1700) ? 'hill' : 'none';
  if (hl > 72) return 'forest';
  if (hl > 11) return 'hill';
  if (z > 770 && z < 1260) return 'cbd';
  if (z < -470 && z > -1180 && x > -1000 && x < 700) return 'downtown';
  if (rd < RIVER_HW + 330) return 'apt';
  return 'mixed';
}

// ── renderer / scene ────────────────────────────────────────────────
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let PR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 16000);
scene.fog = new THREE.FogExp2(0x0a1430, 0.0004);

// ════════════════════════════════════════════════════════════════════
//  Procedural textures
// ════════════════════════════════════════════════════════════════════
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, srgb = true, rep = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = ANISO; t.needsUpdate = true; return t;
}
function speckle(g, w, h, n, cols, smin = 1, smax = 3, alpha = 0.15) {
  for (let i = 0; i < n; i++) { g.globalAlpha = R(0.2, 1) * alpha; g.fillStyle = pick(cols); const s = R(smin, smax); g.fillRect(R(0, w), R(0, h), s, s); }
  g.globalAlpha = 1;
}
function streaks(g, w, h, n, col, alpha = 0.12) { // rain stains
  for (let i = 0; i < n; i++) { const x = R(0, w), y = R(0, h), l = R(20, h * 0.4); const gr = g.createLinearGradient(0, y, 0, y + l); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = R(0.3, 1) * alpha; g.fillStyle = gr; g.fillRect(x, y, R(2, 8), l); }
  g.globalAlpha = 1;
}
function fitText(g, text, maxW, size, weight = 900) { let s = size; g.font = `${weight} ${s}px ${FONT}`; while (g.measureText(text).width > maxW && s > 8) { s -= 2; g.font = `${weight} ${s}px ${FONT}`; } return s; }

// office curtain wall (blue-grey glass grid) — tile 48 m × 64 m
function texOffice(variant) {
  const W = 1024, H = 1024, cols = 16, rows = 16, cw = W / cols, ch = H / rows;
  const [cm, gm] = mkCanvas(W, H), [ce, ge] = mkCanvas(W, H), [cr, gr] = mkCanvas(W, H);
  const frame = variant === 'dark' ? '#2a3238' : variant === 'stone' ? '#b9b2a6' : '#5b6570';
  gm.fillStyle = frame; gm.fillRect(0, 0, W, H);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, W, H);
  gr.fillStyle = variant === 'stone' ? 'rgb(0,215,0)' : 'rgb(0,140,90)'; gr.fillRect(0, 0, W, H);
  for (let r = 0; r < rows; r++) {
    const floorLit = chance(variant === 'dark' ? 0.35 : 0.48);
    const tint = pick(['#e3ecff', '#f1f5ff', '#d6e6ff', '#fff4dc', '#e8fff6']);
    const y = r * ch;
    if (variant === 'stone') { // ribbon windows in stone bands
      const gy = y + ch * 0.32, gh = ch * 0.5;
      const s = R(-10, 10);
      gm.fillStyle = `rgb(${52 + s},${64 + s},${76 + s})`; gm.fillRect(0, gy, W, gh);
      gr.fillStyle = 'rgb(0,30,180)'; gr.fillRect(0, gy, W, gh);
      for (let c = 0; c < cols * 2; c++) {
        const x = c * cw / 2;
        gm.fillStyle = '#8f8a82'; gm.fillRect(x, gy, 3, gh);
        const lit = floorLit ? chance(0.82) : chance(0.1);
        if (lit) { ge.globalAlpha = R(0.5, 1); ge.fillStyle = tint; ge.fillRect(x + 3, gy, cw / 2 - 3, gh); ge.globalAlpha = 1; ge.fillStyle = '#fff'; ge.fillRect(x + 3, gy + 2, cw / 2 - 3, 2); }
        if (chance(0.2)) { gm.fillStyle = 'rgba(215,215,210,.85)'; gm.fillRect(x + 3, gy, cw / 2 - 3, gh * R(0.3, 0.8)); }
      }
      gm.fillStyle = 'rgba(0,0,0,.12)'; gm.fillRect(0, gy + gh, W, 3);
      continue;
    }
    for (let c = 0; c < cols; c++) {
      const x = c * cw;
      const mul = variant === 'dark' ? 2 : 1;
      for (let k = 0; k < mul; k++) {
        const sw = cw / mul, gx = x + k * sw + 2, gy = y + 2, gw = sw - 4, gh = ch * (variant === 'dark' ? 0.86 : 0.72);
        const grd = gm.createLinearGradient(0, gy, 0, gy + gh); const s = R(-12, 12);

function setupComposer() {

  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.55, 0.85); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  fxPass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
      void main(){ vec2 c = vUv - 0.5; float r = dot(c,c);
        vec2 off = c * r * 0.004;
        vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
        col *= 1.0 - r * 0.85;
        col += (h(vUv*uRes + fract(uTime)*100.) - 0.5) * 0.028;
        gl_FragColor = vec4(col, 1.0); }`,
  });
  composer.addPass(fxPass);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); if (composer) { composer.setSize(innerWidth, innerHeight); fxPass.uniforms.uRes.value.set(innerWidth, innerHeight); }
});
const clock = new THREE.Clock(); let TIME = 0;
const _camF = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); TIME += dt;
  if (STATE.auto) { STATE.hour = (STATE.hour + dt * STATE.rate) % 24; if (Math.floor(TIME * 4) !== Math.floor((TIME - dt) * 4)) syncUI(); }
  updateControls(dt); updateTour(dt);
  sky.position.copy(camera.position);
  PART_U.uTime.value = TIME; PART_U.uCam.value.copy(camera.position);
  updateAtmos(dt, TIME);
  const dens = dayDensity(STATE.hour);
  updateTraffic(dt, 0.25 + 0.75 * dens);
  updatePeople(dt, TIME, dens, STATE.w.rain);
  updateMetro(dt); updateFlyers(TIME);
  for (const c of ANIM.cranes) c.grp.rotation.y = c.base + Math.sin(TIME * c.speed * 3) * 1.2;
  for (const g of ANIM.groups) {
    g.grp.position.y = g.base.y + Math.sin(TIME * 0.4 + g.ph) * g.amp;
    if (g.rot) { g.grp.rotation.x = g.rot.x + Math.sin(TIME * 0.31 + g.ph) * (g.ramp || 0); g.grp.rotation.z = g.rot.z + Math.cos(TIME * 0.27 + g.ph) * (g.ramp || 0); if (g.rspin) g.grp.rotation.y = g.rot.y + Math.sin(TIME * 0.05 + g.ph) * 0.25; }
  }
  for (const s of ANIM.spinners) s.m.rotation[s.axis] += dt * s.speed;
  for (const f of ANIM.floaters) { _camF.set(f.p[0], f.p[1], f.p[2]); if (_camF.distanceTo(camera.position) < 1800) updateFloater(f, TIME); }
  for (const c of CABLE.cabs) { const u = 0.5 - 0.5 * Math.cos((TIME * 0.02 + c.ph) * Math.PI * 2); c.m.position.lerpVectors(CABLE.a, CABLE.b, u); c.m.position.z += c.s * 3; c.m.position.y -= 3.2; }
  for (const s of SCREENS) s.update(TIME, dt);
  fxPass.uniforms.uTime.value = TIME;
  updateCaption(dt); updateClock(dt);
  composer.render();
  if (window.SEOUL) window.SEOUL.frames++;
}

// ════════════════════════════════════════════════════════════════════
//  Boot
// ════════════════════════════════════════════════════════════════════
async function main() {
  try { await Promise.race([Promise.all([document.fonts.load(`900 40px "Noto Sans KR"`), document.fonts.load(`500 20px "Noto Sans KR"`), document.fonts.load(`700 20px "Noto Sans KR"`)]), new Promise((r) => setTimeout(r, 3000))]); } catch (e) { /* system fonts */ }
  await step('텍스처 · textures'); buildMaterials(); makeInstancers(); initExtraMats();
  await step('지형 · terrain'); buildTerrain(); buildWater();
  await step('도로 · roads'); registerSpecials(); buildHQs(); buildRoads(); buildHighway();
  await step('한강 다리 · bridges'); buildBridge(-1200, 'girder'); buildBridge(-700, 'girder'); buildBridge(-200, 'arch'); buildBridge(300, 'subway'); buildBridge(800, 'torn'); buildBridge(1300, 'cable');
  await step('랜드마크 · landmarks'); buildMokmyeok(); buildPalace(); buildCrystal(); buildIce(); buildCraterSite(); buildCanyonSite(); buildPatches();
  await step('도시 · city blocks'); buildCity(); ringForest();
  await step('메시 · meshes'); for (const k in IMS) IMS[k].build(); flushBuckets(); buildWires();
  await step('대기 · atmosphere'); buildParticles(); buildReflections(); buildTraffic(); buildMetro(); buildPeople(); buildFlyers();
  setupComposer(); definePOIs(); setupUI();
  setView(POIS[0].pos, POIS[0].look);
  updateAtmos(0.016, 0); updateEnv();
  await step('컴파일 · compiling shaders');
  try { renderer.compile(scene, camera); } catch (e) { /* lazy compile */ }
  window.SEOUL = { THREE, ANIM, STATE, CTL, POIS, goPOI, setView, setWeather, camera, scene, renderer, info: () => renderer.info, frames: 0 };
  frame();
  setTimeout(() => { $('loader').classList.add('done'); showCaption({ ko: '서울, 2038', en: 'Five years after the Aurora', d: '그해 가을 하늘에 걸린 푸른 빛은 사흘 만에 사라졌다. 남은 것은 능력과 상처, 그리고 내일 아침의 출근길.' }, 9); }, 400);
}
main().catch((e) => { console.error(e); const el = $('err'); el.style.display = 'block'; el.textContent += (e && e.stack) || e; });
